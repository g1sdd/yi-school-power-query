<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>寝室电费</title>
<link rel="icon" href="/icons/favicon.png" />
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e8eaed; --line2:#f0f1f3;
    --fg:#1f2329; --sub:#8a919f; --faint:#b0b6c0;
    --brand:#2563eb; --brand-soft:#eff4ff;
    --ok:#10b981; --warn:#f59e0b; --crit:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);
    padding:24px 16px calc(28px + env(safe-area-inset-bottom));
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:420px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px}
  h1{margin:0 0 4px;font-size:20px;font-weight:600}
  .lead{color:var(--sub);font-size:13.5px;margin-bottom:4px}
  label{display:block;font-size:13px;color:var(--sub);margin:18px 0 7px}
  input,select{width:100%;background:#fff;color:var(--fg);border:1px solid var(--line);
        border-radius:10px;padding:12px 13px;font-size:15.5px;font-family:inherit;outline:none;
        transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
  input::placeholder{color:var(--faint)}
  button{background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:10px;
        padding:12px 16px;font-size:14.5px;font-family:inherit;cursor:pointer;
        transition:border-color .15s,background .15s}
  button:hover:not(:disabled){border-color:#cfd4dc}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{width:100%;margin-top:20px;background:var(--brand);border-color:var(--brand);
        color:#fff;font-weight:500;font-size:15.5px;padding:13px}
  button.primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
  .field{display:flex;gap:9px;align-items:stretch}
  .field input{flex:1;min-width:0}
  .cap{width:120px;min-width:120px;height:48px;border:1px solid var(--line);border-radius:10px;
       background:#fafbfc;object-fit:contain;padding:3px;cursor:pointer;flex:none;
       overflow:hidden;font-size:11px}
  .cap.empty{display:flex;align-items:center;justify-content:center;color:var(--faint);
       font-size:12px;text-align:center;line-height:1.3}
  .hint{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.7}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13.5px;display:none;line-height:1.65}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}
  .msg.info{display:block;background:var(--brand-soft);border:1px solid #dbeafe;color:#1e40af}
  .msg.warn{display:block;background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  .who{display:flex;align-items:center;justify-content:space-between;gap:10px;
       padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:2px}
  .who b{font-size:14.5px;font-weight:600}
  .who small{color:var(--sub);font-size:12.5px;display:block;font-weight:400}
  .who a{font-size:13px;color:var(--brand);text-decoration:none;white-space:nowrap}
  .bal{margin-top:18px;background:#fafbfc;border:1px solid var(--line);border-radius:14px;padding:18px 16px}
  .bal .k{font-size:12.5px;color:var(--sub);margin-bottom:2px}
  .bal .big{font-size:36px;font-weight:600;letter-spacing:-.5px;line-height:1.15;margin-bottom:2px}
  .bal .big span{font-size:16px;font-weight:500;color:var(--sub);margin-left:4px}
  .bal .row{display:flex;gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
  .bal .row > div{flex:1;min-width:0}
  .bal .v{font-size:18px;font-weight:600}
  .bal .v small{font-size:12px;color:var(--sub);font-weight:400;margin-left:2px}
  .bal .room{font-size:13px;line-height:1.55;margin-bottom:12px}
  pre{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:12px;
      font-size:11.5px;color:#4b5563;white-space:pre-wrap;word-break:break-all;line-height:1.7;
      margin:10px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:300px;overflow:auto}
  details{margin-top:14px}
  summary{cursor:pointer;color:var(--sub);font-size:12.5px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--faint)}
  details[open] summary::before{content:"▾ "}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>寝室电费</h1>
    <div class="lead">登录一次，之后打开就能直接看。</div>

    <!-- 未登录 -->
    <div id="loginView">
      <label for="phone">手机号</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
             maxlength="11" placeholder="11 位手机号" />

      <label for="school">学校</label>
      <input id="school" type="text" list="schoolList" autocomplete="off"
             spellcheck="false" placeholder="输入或选择学校" />
      <datalist id="schoolList"></datalist>

      <label for="captcha">验证码</label>
      <div class="field">
        <input id="captcha" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" maxlength="8" placeholder="填右边的字符" />
        <img id="capImg" class="cap" alt="验证码" title="点一下换一张" />
        <div id="capEmpty" class="cap empty hide">点此加载</div>
      </div>

      <button class="primary" id="sendBtn">获取验证码</button>
      <div class="msg" id="msg1"></div>

      <div id="smsBox" class="hide">
        <label for="sms">短信验证码</label>
        <input id="sms" type="tel" inputmode="numeric" autocomplete="one-time-code"
               maxlength="8" placeholder="短信里的数字" />
        <button class="primary" id="loginBtn">登录</button>
        <div class="msg" id="msg2"></div>
      </div>
    </div>

    <!-- 已登录 -->
    <div id="homeView" class="hide">
      <div class="who">
        <div><b id="whoPhone">—</b><small id="whoSchool"></small></div>
        <a href="javascript:switchUser()">换个手机号</a>
      </div>

      <label for="room">寝室</label>
      <select id="room"></select>
      <button class="primary" id="queryBtn">查询</button>
      <div class="msg" id="msg3"></div>

      <div id="result" class="hide">
        <div class="bal">
          <div class="room" id="roomName">—</div>
          <div class="k">当前余额</div>
          <div class="big"><span id="amount">—</span><span id="amountUnit">元</span></div>
          <div class="row">
            <div>
              <div class="k">剩余电量</div>
              <div class="v"><span id="surplus">—</span><small>度</small></div>
            </div>
            <div>
              <div class="k">查询时间</div>
              <div class="v" id="queriedAt" style="font-size:13px;line-height:1.6">—</div>
            </div>
          </div>
        </div>
        <details>
          <summary>原始数据</summary>
          <pre id="raw"></pre>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const K_TOKEN = "ysp.direct.token";
const K_PHONE = "ysp.direct.phone";
const K_SCHOOL = "ysp.direct.school";

let token = localStorage.getItem(K_TOKEN) || "";
let sid = "";          // 只在登录过程中用的一次性会话
let timer = null, sendAt = 0;

function say(sel, text, kind="info"){
  const m = $(sel);
  if(!text){ m.className = "msg"; m.textContent = ""; return; }
  m.className = "msg " + kind; m.textContent = text;
}
function setBusy(btn, busy, label){
  if(!btn) return;
  if(busy){ btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = label || "请稍等…"; }
  else { btn.disabled = false; btn.textContent = btn.dataset.label || btn.textContent; }
}
async function api(path, body){
  const headers = {"Content-Type": "application/json"};
  if(token) headers["X-YS-Token"] = token;
  const r = await fetch(path, {method: "POST", headers, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({error: "服务器没有响应（HTTP " + r.status + "）"}));
  if(!r.ok){
    const err = new Error(j.error || ("HTTP " + r.status));
    err.kind = j.kind || "";
    throw err;
  }
  return j;
}
async function apiGet(path){
  const headers = {};
  if(token) headers["X-YS-Token"] = token;
  const r = await fetch(path, {headers});
  return r.json();
}
function show(el, on){ $(el).classList.toggle("hide", !on); }

// ---------------------------------------------------------------- 学校
async function loadSchools(){
  try{
    const j = await apiGet("/api/direct/schools");
    const list = $("#schoolList");
    list.innerHTML = "";
    (j.schools || []).forEach(s => {
      const o = document.createElement("option");
      o.value = s.name;
      o.textContent = s.code;
      list.appendChild(o);
    });
    const saved = localStorage.getItem(K_SCHOOL);
    $("#school").value = saved || (j.schools[0] ? j.schools[0].name : "");
  }catch(e){ /* 拿不到就让用户手填 */ }
}

// ---------------------------------------------------------------- 验证码
function renderCaptcha(cap){
  const img = $("#capImg"), empty = $("#capEmpty");
  const ok = cap && cap.data_uri;
  img.classList.toggle("hide", !ok);
  empty.classList.toggle("hide", !!ok);
  if(ok){
    img.src = cap.data_uri;
    img.onclick = refreshCaptcha;
    img.onerror = () => {
      img.classList.add("hide");
      empty.classList.remove("hide");
      empty.textContent = "点此重试";
    };
  }
  empty.onclick = refreshCaptcha;
}

async function start(){
  try{
    const j = await api("/api/direct/start", { school: $("#school").value });
    sid = j.session_id;
    renderCaptcha(j.captcha);
  }catch(e){
    renderCaptcha(null);
    say("#msg1", e.message, "err");
  }
}

async function refreshCaptcha(){
  if(!sid){ return start(); }
  const img = $("#capImg");
  img.style.opacity = .4;
  try{
    const j = await api("/api/direct/captcha", { session_id: sid });
    renderCaptcha(j.captcha);
    $("#captcha").value = "";
  }catch(e){
    if(e.kind === "expired"){ sid = ""; return start(); }
    say("#msg1", e.message, "err");
  }finally{ img.style.opacity = 1; }
}

// ---------------------------------------------------------------- 发短信 / 登录
function countdown(sec){
  clearInterval(timer);
  sendAt = Date.now();
  const btn = $("#sendBtn");
  const tick = () => {
    const left = sec - Math.floor((Date.now() - sendAt) / 1000);
    if(left <= 0){
      clearInterval(timer);
      btn.disabled = false; btn.textContent = "重新获取";
      return;
    }
    btn.disabled = true; btn.textContent = left + " 秒后可重发";
  };
  tick();
  timer = setInterval(tick, 500);
}

$("#sendBtn").onclick = async () => {
  const phone = $("#phone").value.replace(/\D/g, "");
  const captcha = $("#captcha").value.trim();
  const school = $("#school").value.trim();
  if(!/^\d{11}$/.test(phone)){ say("#msg1", "手机号是 11 位数字", "err"); return; }
  if(!school){ say("#msg1", "请选择学校", "err"); return; }
  if(!$("#capImg").classList.contains("hide") && !captcha){
    say("#msg1", "请填右边的验证码", "err"); return;
  }
  if(!sid){ await start(); if(!sid) return; }
  const btn = $("#sendBtn");
  setBusy(btn, true, "发送中…");
  try{
    const j = await api("/api/direct/send-code",
      { session_id: sid, phone, captcha, school });
    localStorage.setItem(K_PHONE, phone);
    localStorage.setItem(K_SCHOOL, school);
    say("#msg1", j.message || "验证码已发送", "ok");
    show("#smsBox", true);
    countdown(60);
    $("#sms").focus();
  }catch(e){
    setBusy(btn, false);
    if(e.kind === "captcha" || e.kind === "token"){ await refreshCaptcha(); }
    if(e.kind === "expired"){ sid = ""; await start(); }
    say("#msg1", e.message, "err");
  }
};

$("#loginBtn").onclick = async () => {
  const code = $("#sms").value.replace(/\D/g, "");
  if(!/^\d{4,8}$/.test(code)){ say("#msg2", "请输入短信里的数字", "err"); return; }
  const btn = $("#loginBtn");
  setBusy(btn, true, "登录中…");
  try{
    const j = await api("/api/direct/login", { session_id: sid, sms_code: code });
    if(j.token){
      token = j.token;
      localStorage.setItem(K_TOKEN, token);
      enterHome(j.user, j.rooms);
      say("#msg3", "", "ok");
    }else{
      say("#msg2", j.warning || "这个手机号名下没有绑定寝室", "warn");
    }
  }catch(e){
    say("#msg2", e.message, "err");
    if(e.kind === "expired"){ sid = ""; await start(); }
    if(e.kind === "code"){ $("#sms").select(); }
  }finally{
    setBusy(btn, false);
  }
};

// ---------------------------------------------------------------- 已登录
function fillRooms(rooms){
  const sel = $("#room");
  sel.innerHTML = "";
  (rooms || []).forEach((r, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = r.label || r.room_code;
    sel.appendChild(o);
  });
}

function enterHome(user, rooms){
  user = user || {};
  $("#whoPhone").textContent = user.phone || "已登录";
  $("#whoSchool").textContent = user.school_name || "";
  fillRooms(rooms);
  show("#loginView", false);
  show("#homeView", true);
  show("#result", false);
}

async function restore(){
  if(!token){ show("#loginView", true); show("#homeView", false); await start(); return; }
  try{
    const j = await apiGet("/api/direct/session");
    if(!j.exists){
      clearLogin();
      show("#loginView", true); show("#homeView", false);
      await start();
      return;
    }
    enterHome(j.user, j.rooms);
    if(!j.has_login){
      say("#msg3", "需要重新验证一次手机号", "warn");
    }
  }catch(e){
    clearLogin();
    show("#loginView", true); show("#homeView", false);
    await start();
  }
}

function clearLogin(){
  token = "";
  localStorage.removeItem(K_TOKEN);
}

function switchUser(){
  api("/api/direct/logout", {}).catch(() => {});
  clearLogin();
  sid = "";
  show("#homeView", false); show("#loginView", true); show("#result", false); show("#smsBox", false);
  say("#msg1", ""); say("#msg2", ""); say("#msg3", "");
  $("#captcha").value = ""; $("#sms").value = "";
  const saved = localStorage.getItem(K_PHONE);
  if(saved) $("#phone").value = saved;
  start();
}

$("#queryBtn").onclick = async () => {
  const idx = parseInt($("#room").value || "0", 10);
  const btn = $("#queryBtn");
  setBusy(btn, true, "查询中…");
  say("#msg3", "", "ok");
  try{
    const j = await api("/api/direct/query", { room_index: idx });
    const b = j.balance || {};
    const hasAmount = b.amount !== null && b.amount !== undefined;
    const hasSurplus = b.surplus !== null && b.surplus !== undefined;
    $("#amount").textContent = hasAmount ? b.amount : (hasSurplus ? b.surplus : "—");
    $("#amountUnit").textContent = hasAmount ? "元" : (hasSurplus ? "度" : "元");
    $("#surplus").textContent = hasSurplus ? b.surplus : "—";
    $("#roomName").textContent = b.display_room_name || (j.room && j.room.label) || "—";
    $("#queriedAt").textContent = new Date().toLocaleString("zh-CN",
      {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
    $("#raw").textContent = JSON.stringify(j.raw, null, 2);
    show("#result", true);
  }catch(e){
    if(e.kind === "relogin" || e.kind === "expired"){
      clearLogin();
      sid = "";
      show("#homeView", false); show("#loginView", true); show("#result", false);
      const saved = localStorage.getItem(K_PHONE);
      if(saved) $("#phone").value = saved;
      const savedSchool = localStorage.getItem(K_SCHOOL);
      if(savedSchool) $("#school").value = savedSchool;
      say("#msg1", e.kind === "relogin" ? "登录已失效，重新验证一下手机号" : "请重新登录", "warn");
      await start();
    }else{
      say("#msg3", e.message, "err");
    }
  }finally{
    setBusy(btn, false);
  }
};

// ---------------------------------------------------------------- 启动
async function boot(){
  await loadSchools();
  const saved = localStorage.getItem(K_PHONE);
  if(saved && !$("#phone").value) $("#phone").value = saved;
  await restore();
}
boot();
</script>
</body>
</html>
