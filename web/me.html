<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>我的寝室 · 寝室电费</title>
<link rel="icon" href="/icons/favicon.png" />
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e8eaed; --line2:#f0f1f3;
    --fg:#1f2329; --sub:#8a919f; --faint:#b0b6c0;
    --brand:#2563eb; --brand-soft:#eff4ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);
    padding:24px 16px;display:flex;align-items:center;justify-content:center;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:520px;margin:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px}
  h1{margin:0 0 2px;font-size:20px;font-weight:600}
  .sub{color:var(--sub);font-size:13px}
  .who{display:flex;align-items:center;justify-content:space-between;gap:10px;
       padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:6px}
  .who a{font-size:13px;color:var(--brand);text-decoration:none}
  .room{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fafbfc}
  .room .name{font-size:13px;line-height:1.5;margin-bottom:10px}
  .room .k{font-size:12.5px;color:var(--sub)}
  .room .v{font-size:32px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
  .room .v span{font-size:15px;font-weight:500;color:var(--sub);margin-left:3px}
  .room .t{font-size:12px;color:var(--faint);margin-top:8px}
  .msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:13.5px;display:none;line-height:1.65}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
  .msg.info{display:block;background:var(--brand-soft);border:1px solid #dbeafe;color:#1e40af}
  button{width:100%;margin-top:18px;background:var(--brand);border:1px solid var(--brand);
        color:#fff;border-radius:10px;padding:13px;font-size:15.5px;font-family:inherit;cursor:pointer}
  button:disabled{opacity:.5}
  button.ghost{background:#fff;color:var(--fg);border-color:var(--line);font-size:14px;padding:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>我的寝室</h1>
    <div class="sub" id="who">加载中…</div>

    <div id="rooms"></div>
    <div class="msg" id="msg"></div>

    <button id="refreshBtn">刷新余额</button>
    <button id="logoutBtn" class="ghost">退出登录</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

function say(text, kind="info"){
  const m = $("#msg");
  if(!text){ m.className = "msg"; m.textContent = ""; return; }
  m.className = "msg " + kind; m.textContent = text;
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(j){
  const u = j.user || {};
  $("#who").textContent = [u.phone, u.school_name].filter(Boolean).join(" · ");
  const box = $("#rooms");
  box.innerHTML = "";
  (j.rooms || []).forEach(r => {
    const amount = (r.last_amount === null || r.last_amount === undefined)
      ? "—" : Number(r.last_amount).toFixed(2);
    const when = r.last_query_at ? String(r.last_query_at).replace("T", " ").slice(5, 16) : "";
    const el = document.createElement("div");
    el.className = "room";
    el.innerHTML =
      '<div class="name">' + esc(r.label || r.room_code) + '</div>' +
      '<div class="k">当前余额</div>' +
      '<div class="v">' + amount + '<span>元</span></div>' +
      (when ? '<div class="t">上次查询 ' + esc(when) + '</div>' : "");
    box.appendChild(el);
  });
  if (!(j.rooms || []).length) say("这个手机号名下还没有绑定寝室。", "err");
}

async function load(){
  const btn = $("#refreshBtn");
  btn.disabled = true;
  try{
    const r = await fetch("/api/direct/me", {credentials: "same-origin"});
    const j = await r.json();
    if(!r.ok || !j.ok){
      if(j.kind === "expired" || r.status === 401){ location.replace("/login"); return; }
      throw new Error(j.error || ("HTTP " + r.status));
    }
    render(j);
    say("");
  }catch(e){
    say(e.message, "err");
  }finally{
    btn.disabled = false;
  }
}

$("#refreshBtn").onclick = load;
$("#logoutBtn").onclick = async () => {
  try{ await fetch("/api/direct/logout", {method: "POST", credentials: "same-origin",
    headers: {"Content-Type": "application/json"}, body: "{}"}); }catch(e){}
  location.replace("/login");
};
load();
</script>
</body>
</html>
